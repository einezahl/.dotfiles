# Shared kitty config, ported from alacritty.toml. Font size and other
# per-machine values come from machine/kitty.conf (set by ./setup).

font_family      UbuntuMono Nerd Font

# kitty's default gamma-corrected compositing renders glyphs thinner/lighter
# than most other terminals. "legacy" restores the older, heavier rasterization.
text_composition_strategy legacy

# Pull Nerd Font icon ranges from the single-cell "Mono" variant. The plain
# variant's icons are double-width; kitty squeezes them into one grid cell,
# shrinking the glyphs and breaking baseline alignment in the powerlevel10k
# prompt. The Mono variant's glyphs are pre-fitted to one cell.
symbol_map U+E000-U+E00A,U+E0A0-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B5,U+E700-U+E7C5,U+EA60-U+EBEB,U+ED00-U+EFCE,U+F000-U+F2FF,U+F300-U+F372,U+F400-U+F532,U+F500-U+FD46,U+F0001-U+F1AF0,U+2665,U+26A1,U+2B58 UbuntuMono Nerd Font Mono

# Match alacritty's decorations = "none"
hide_window_decorations yes

# dark grey instead of pure black (gruvbox bg, same family as the tmux
# status colors). Lighter alternatives: #2e2e2e, #32302f
background #282828

# kitty draws the transparency itself: picom on the i3 machines keeps windows
# opaque (active/inactive-opacity 1 in picom/picom.conf), macOS has no
# compositor for it.
background_opacity 0.9

# Don't ask for confirmation when closing a window with a running process
confirm_os_window_close 0

# Close the window as soon as the shell exits. By default kitty waits for every
# process still attached to the terminal, and clipboard helpers (xsel/xclip,
# used by nvim, tmux, Claude Code) stay alive until something else copies,
# which kept windows open after `exit`.
close_on_child_death yes

# Keep scrollback reasonable
scrollback_lines 10000

# No bells
enable_audio_bell no

include ${HOME}/.dotfiles/machine/kitty.conf
