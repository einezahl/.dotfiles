# Kitty terminal config — ported from alacritty.toml

font_family      UbuntuMono Nerd Font
font_size        20.0

# Match alacritty's decorations = "none"
hide_window_decorations yes

# Don't ask for confirmation when closing a window with a running process
confirm_os_window_close 0

# Treat the left Option key as Alt so Alt-bindings work inside the
# terminal (tmux, shell). Right Option stays macOS-native for special
# characters. Change to "yes" or "no" if this doesn't suit your layout.
macos_option_as_alt left

# Keep scrollback reasonable
scrollback_lines 10000

# No bells
enable_audio_bell no
