# 4K monitor profile
font pango:Ubuntu Nerd Font 22

# Display mode is applied synchronously in scripts/i3_autostart.sh before any
# app launches — racing it as an `exec` here made kitty start with the
# wrong resolution and tiny fonts. Keep DPMS-off here; it's harmless to race.
exec --no-startup-id xset s off -dpms

# Manual reapply (sometimes needed after sleep / cable replug)
bindsym $mod+apostrophe exec --no-startup-id xrandr --output DP-4 --mode 3840x2160 --rate 143.99
