# 4K monitor profile
font pango:Ubuntu Nerd Font 22

# Display settings: DisplayPort source is required for 4K @144Hz.
# xrdb merge picks up Xresources DPI/cursor; xset disables DPMS so the
# monitor doesn't lose connection when locking.
exec --no-startup-id xrandr --output DP-0 --mode 3840x2160 --rate 143.99
exec --no-startup-id xrdb -merge ~/.Xresources
exec --no-startup-id xset s off -dpms

# Manual reapply (sometimes needed after sleep / cable replug)
bindsym $mod+apostrophe exec --no-startup-id xrandr --output DP-4 --mode 3840x2160 --rate 143.99
