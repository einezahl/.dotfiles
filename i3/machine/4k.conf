# 4K monitor profile
font pango:Ubuntu Nerd Font 22

# Display mode is applied synchronously in scripts/i3_autostart.sh before any
# app launches — racing it as an `exec` here made kitty start with the
# wrong resolution and tiny fonts. Keep DPMS-off here; it's harmless to race.
exec --no-startup-id xset s off -dpms

# Manual reapply after the monitor was powered off/on: the NVIDIA driver
# keeps DP-0 "connected" but does not re-train the DisplayPort link, so the
# screen stays black until the output is toggled off and on again.
bindsym $mod+apostrophe exec --no-startup-id "xrandr --output DP-0 --off; sleep 1; xrandr --output DP-0 --mode 3840x2160 --rate 143.99 --primary"
