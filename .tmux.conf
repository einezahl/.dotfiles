set-option -g default-shell /usr/bin/zsh
set-option -g history-limit 100000
set -g mouse on

# for neovim
set -sg escape-time 10

# vi for copy mode
setw -g mode-keys vi

# easier copy-mode entry + vim-style selection/yank with system clipboard sync
bind Escape copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -sel clip -i"

# status bar
set -g status-right "#(pomo)"
set -g status-style "fg=#665c54"
set -g status-left-style "fg=#928374"

set -g status-bg default
set -g status-position bottom
set -g status-interval 1
set -g status-justify left
set -g status-left ""

# Layout: [windows on left] [session name centered] [pomo on right].
# We override status-format[0] because tmux's three default sections
# (status-left, window-list, status-right) don't include a center slot.
set -g status-format[0] "#[align=left]#{W:#[range=window|#{window_index} #{E:window-status-style}]#{T:window-status-format}#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} #{E:window-status-current-style} list=focus]#{T:window-status-current-format}#[norange default list=on]#{?window_end_flag,,#{window-status-separator}}}#[align=centre]#[fg=white,bold] #S #[align=right]#[fg=#665c54]#{T:status-right}"

# Drop the trailing flag chars (* - # ! ~) and mark the active window with
# white text instead. Inactive windows inherit status-style (dim grey).
set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W"
set -g window-status-current-style "fg=white"

# disable status
# set -g status off
# set -g status on

# count the panes from 1
set -g base-index 1
setw -g pane-base-index 1

# reload configuration
bind-key -r r source-file ~/.tmux.conf
 
# set the window numbering in accordance with real programmers qwerty layout
bind-key '1' select-window -t :1
bind-key '2' select-window -t :2
bind-key '3' select-window -t :3
bind-key '4' select-window -t :4
bind-key '5' select-window -t :5
bind-key '6' select-window -t :6
bind-key '7' select-window -t :7
bind-key '8' select-window -t :8
bind-key '9' select-window -t :9
bind-key '0' select-window -t :10

bind q killp
# term colors, these are the correct ones according to neovim checkhealth

# set-option -g default-terminal "screen-256color"

bind-key -r f run-shell "tmux neww ~/.dotfiles/scripts/tmux_sessionizer.sh"
set -g default-terminal "tmux-256color"
# set -ag terminal-overrides ",xterm-256color:RGB"
set -g allow-passthrough on
set -g visual-activity off
# set -as terminal-features ',*:passthrough'et -as terminal-features ',*:passthrough'
