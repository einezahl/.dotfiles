set-option -g history-limit 25000
set -g mouse on

# for neovim
set -sg escape-time 10

# vi for copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind-key C-space copy-mode

# vim navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# status bar
set -g status-right "#(pomo)"
set -g status-style "fg=#665c54"
set -g status-left-style "fg=#928374"

set -g status-bg default
set -g status-position top
set -g status-interval 1
set -g status-left ""

# disable status
# set -g status off
# set -g status on

# count the panes from 1
set -g base-index 1
setw -g pane-base-index 1

# reload configuration
bind-key -r r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
 
# set the window numbering in accordance with real programmers qwerty layout
bind-key '+' select-window -t :1
bind-key '[' select-window -t :2
bind-key '{' select-window -t :3
bind-key '(' select-window -t :4
bind-key '&' select-window -t :5
bind-key '=' select-window -t :6
bind-key ')' select-window -t :7
bind-key '}' select-window -t :8
bind-key ']' select-window -t :9
bind-key '*' select-window -t :10
bind-key 'h' split-window -hf
bind-key 'v' split-window -vf

bind q killp

# term colors, these are the correct ones according to neovim checkhealth

set-option -g default-terminal "screen-256color"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'   

# type this in terminal if tmux is already running
# tmux source ~/.tmux.conf
