# /bin/zsh exists on macOS and, through the merged /usr, on Ubuntu
set-option -g default-shell /bin/zsh
set-option -g history-limit 100000
set -g mouse on

# for neovim
set -sg escape-time 10

# vi for copy mode
setw -g mode-keys vi

# easier copy-mode entry + vim-style selection/yank with system clipboard sync
bind Escape copy-mode
bind-key C-space copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
# yank to the system clipboard: pbcopy on macOS, xclip on Linux
if-shell 'uname | grep -q Darwin' \
    "set -s copy-command 'pbcopy'" \
    "set -s copy-command 'xclip -in -selection clipboard'"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# vim navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# status bar
set -g status-right ""
set -g status-right-length 20
set -g status-style "fg=#665c54"
set -g status-left-style "fg=#928374"

set -g status-bg default
set -g status-position top
set -g status-interval 1
set -g status-justify left
set -g status-left ""

# Layout: [windows on left] [session name centered] [pomo on right].
# Override status-format[0] because tmux's three default sections
# (status-left, window-list, status-right) don't include a centre slot.
# We loop windows manually with list=on/nolist markers (required for align=
# transitions after the window list) and emit #[align=centre]#S in the middle.
# To truly center #S, mirror the window list AND the status-right on the
# opposite side, replacing every character with a space (#{s/./ /:...}) so the
# mirror keeps its width but draws no glyphs. A space paints only a background
# cell, so the mirror stays invisible on any desktop background regardless of
# the terminal's window opacity. Both sides then have width = windows + time.
set -g status-format[0] "#[list=on align=left]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[#{E:window-status-style}]#{T:window-status-format}#[norange list=on default]#{?window_end_flag,,#{window-status-separator}},#[#{E:window-status-current-style} list=focus]#{T:window-status-current-format}#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist]#{s/./ /:#{T:status-right}}#[align=centre fg=white bold]#S#[align=right]#{W:#{s/./ /:#{T:window-status-format}}#{?window_end_flag,,#{window-status-separator}},#{s/./ /:#{T:window-status-current-format}}#{?window_end_flag,,#{window-status-separator}}}#[#{E:status-right-style}]#{T:status-right}"

# Drop the trailing flag chars (* - # ! ~) and mark the active window with
# white text instead. Inactive windows inherit status-style (dim grey).
set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W"
set -g window-status-current-style "fg=white"

# disable status
# set -g status off
# set -g status on

# count the panes from 1
set -g base-index 1
setw -g pane-base-index 1

# reload configuration
bind-key -r r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

bind-key '1' select-window -t :1
bind-key '2' select-window -t :2
bind-key '3' select-window -t :3
bind-key '4' select-window -t :4
bind-key '5' select-window -t :5
bind-key '6' select-window -t :6
bind-key '7' select-window -t :7
bind-key '8' select-window -t :8
bind-key '9' select-window -t :9
bind-key '0' select-window -t :10
bind-key 'h' split-window -hf
bind-key 'v' split-window -vf

bind-key -r f run-shell "tmux neww ~/.dotfiles/scripts/tmux_sessionizer.sh"

bind q killp

bind-key w send-keys -t node r

# term colors, these are the correct ones according to neovim checkhealth
set -g default-terminal "tmux-256color"
# shell/linux.zsh exports TERM=xterm-256color, whose terminfo has no RGB flag,
# so tmux would downgrade 24-bit colors to the 256 palette. That breaks kitty's
# image placeholders (the image id travels as a 24-bit foreground color), so
# yazi previews stay empty inside tmux. Declare the outer terminal truecolor.
set -as terminal-features ',xterm-256color:RGB'
set -g visual-activity off

# allow kitty graphics protocol through (image previews in yazi, image.nvim)
set -g allow-passthrough on
# Advertise graphics passthrough so kitty's image protocol survives tmux
# (needed by image.nvim alongside `allow-passthrough on` above).
set -as terminal-features ',*:passthrough'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# only when tpm is installed: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
if-shell 'test -d ~/.tmux/plugins/tpm' "run '~/.tmux/plugins/tpm/tpm'"

# type this in terminal if tmux is already running
# tmux source ~/.tmux.conf
