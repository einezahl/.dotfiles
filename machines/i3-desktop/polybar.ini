; Hardware values for polybar on the i3 desktop. Referenced as
; ${machine.<key>} from polybar/cuts/*.ini.

[machine]
; xrandr output the bars are drawn on, empty = first one found
;   $ polybar -m | cut -d ':' -f 1
monitor = HDMI-1-1

; network interface shown in the bottom bar
;   $ ip -o link show | awk -F': ' '{print $2}'
network-interface = eth0
