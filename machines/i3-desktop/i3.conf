# i3 settings that only apply to the i3 desktop, included from i3/config.
# Display layout: two 1920x1200 monitors side by side, HDMI-1-1 on the right
# is the primary one and hosts workspace 1.

exec --no-startup-id xrandr --output HDMI-1-1 --primary --mode 1920x1200 --pos 1920x0 --output HDMI-1-3 --mode 1920x1200 --pos 0x0

set $fm HDMI-1-1
workspace 1 output $fm
