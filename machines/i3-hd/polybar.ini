; Hardware values and sizes for polybar on the HD (1080p) i3 machine.
; Referenced as ${machine.<key>} from polybar/cuts/*.ini.

[machine]
; xrandr output the bars are drawn on, empty = first one found
;   $ polybar -m | cut -d ':' -f 1
monitor =

; network interface shown in the bottom bar
;   $ ip -o link show | awk -F': ' '{print $2}'
network-interface = eth0

font-text       = 0xProto Nerd Font:style=Medium:size=10;4
font-powerline  = 0xProto Nerd Font:style=Medium:size=19;3
font-fill       = 0xProto Nerd Font:style=Medium:size=12;4
font-small      = 0xProto Nerd Font:style=Medium:size=7;4
bar-width       = 6
