; Hardware values and sizes for polybar on the 4K i3 machine. Referenced as
; ${machine.<key>} from polybar/cuts/*.ini.

[machine]
; xrandr output the bars are drawn on, empty = first one found
;   $ polybar -m | cut -d ':' -f 1
monitor =

; network interface shown in the bottom bar
;   $ ip -o link show | awk -F': ' '{print $2}'
network-interface = enp39s0

font-text       = 0xProto Nerd Font:style=Medium:size=20;4
font-powerline  = 0xProto Nerd Font:style=Medium:size=38;3
font-fill       = 0xProto Nerd Font:style=Medium:size=24;4
font-small      = 0xProto Nerd Font:style=Medium:size=14;4
bar-width       = 10
