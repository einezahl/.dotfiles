# MacBook: Retina display, so the font is larger than on the Ubuntu machines

font_size 24.0

# Start zsh explicitly. Apps launched from the Dock get the SHELL that
# launchd recorded at login, which lags behind chsh until the next logout.
shell /bin/zsh --login

# On the i3 machines picom makes windows semi-transparent (inactive-opacity
# 0.9 in picom/picom.conf). macOS has no compositor for that, so kitty draws
# the transparent background itself.
background_opacity 0.9
dynamic_background_opacity yes

# Treat the left Option key as Alt so Alt-bindings work inside the
# terminal (tmux, shell). Right Option stays macOS-native for special
# characters. Change to "yes" or "no" if this doesn't suit your layout.
macos_option_as_alt left
